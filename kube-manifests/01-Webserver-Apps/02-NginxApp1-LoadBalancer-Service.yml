apiVersion: v1
kind: Service
metadata:
  name: app1-nginx-service   # Renamed (cleaner, since it's LoadBalancer)
  labels:
    app: app1-nginx
spec:
  type: LoadBalancer
  selector:
    app: app1-nginx

  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP

  sessionAffinity: None

  externalTrafficPolicy: Cluster
